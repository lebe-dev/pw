suite: redis auth secret
templates:
  - redis-secret.yaml
release:
  name: pw
  namespace: pw
tests:
  - it: uses the password from values when it is set
    set:
      redis.auth.password: from-values
    asserts:
      - equal:
          path: data.redis-password
          value: ZnJvbS12YWx1ZXM=

  - it: generates a random password on first install
    asserts:
      - matchRegex:
          path: data.redis-password
          decodeBase64: true
          pattern: ^[a-zA-Z0-9]{16}$

  - it: reuses the password of the existing secret on upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: pw-redis-auth
            namespace: pw
          data:
            redis-password: ZXhpc3RpbmctcGFzc3dvcmQ=
    asserts:
      - equal:
          path: data.redis-password
          value: ZXhpc3RpbmctcGFzc3dvcmQ=

  - it: prefers the password from values over the existing secret
    set:
      redis.auth.password: from-values
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: pw-redis-auth
            namespace: pw
          data:
            redis-password: ZXhpc3RpbmctcGFzc3dvcmQ=
    asserts:
      - equal:
          path: data.redis-password
          value: ZnJvbS12YWx1ZXM=

  - it: renders no secret when auth is disabled
    set:
      redis.auth.enabled: false
    asserts:
      - hasDocuments:
          count: 0
