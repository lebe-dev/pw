<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Default title for the SPA shell. Svelte appends <svelte:head> nodes *after* this
		     one and the browser honours the first <title> in tree order, so pages that need a
		     different title assign document.title instead (see routes/s/[id]/+page.svelte). -->
		<title>PW — secret sharing service</title>
		<!-- Link preview bots (Telegram, Slack, WhatsApp, ...) do not run JS, so these tags must live
		     in the static shell. The backend serves this same file for every route, including
		     /s/<id>, so the preview never reveals anything about a particular secret. -->
		<meta name="description" content="Share passwords and secrets via one-time encrypted links" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="PW" />
		<meta property="og:title" content="PW — secret sharing service" />
		<meta
			property="og:description"
			content="Share passwords and secrets via one-time encrypted links"
		/>
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="PW — secret sharing service" />
		<meta
			name="twitter:description"
			content="Share passwords and secrets via one-time encrypted links"
		/>
		<script>
			(function () {
				const mode = localStorage.getItem('mode-watcher-mode') || 'system';
				const light =
					mode === 'light' ||
					(mode === 'system' && globalThis.matchMedia('(prefers-color-scheme: light)').matches);
				if (!light) {
					document.documentElement.classList.add('dark');
				}
				document.documentElement.style.colorScheme = light ? 'light' : 'dark';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
