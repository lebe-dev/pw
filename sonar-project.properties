sonar.projectKey=pw
# sonar.projectVersion is passed at scan time from Cargo.toml (see `just sonar-scan`).

sonar.sourceEncoding=UTF-8

# --- Sources ---
# Analyse the whole repo, minus vendored/generated/build artifacts and test code
# (test files are picked up separately via sonar.test.inclusions below).
# templates/email/** is excluded on purpose: HTML email uses table-based layout
# and deprecated presentational attributes (cellpadding/width/role=presentation)
# for mail-client compatibility — Web:S1827/S5257/S6819 are noise there.
sonar.sources=.
sonar.exclusions=\
  scripts/**,\
  frontend/src/lib/components/ui/**,\
  target/**,\
  frontend/node_modules/**,\
  frontend/.svelte-kit/**,\
  frontend/build/**,\
  frontend/dist/**,\
  frontend/coverage/**,\
  web/dist/**,\
  data/**,\
  **/testdata/**,\
  templates/email/**

# --- Tests ---
# Only Rust *integration* tests live under tests/. Rust *unit* tests live inline
# in their modules inside `#[cfg(test)] mod tests` blocks, sharing a .rs file
# with the production code they test. SonarQube classifies test vs. main code at
# file granularity, so those inline tests cannot be marked as test sources — the
# whole file is analysed as main code. As a consequence inline-test lines are
# counted as main coverage (slightly inflating the figure) and analysed for code
# smells as production code. This is an accepted limitation of Rust's inline-test
# convention; keeping the stable toolchain (rust-toolchain.toml) is preferred
# over the nightly `#[coverage(off)]` attribute that would be needed to exclude
# them. Do not "fix" this by adding src/**/*.rs here — that would mislabel all
# backend production code as test code.
sonar.tests=.
sonar.test.inclusions=\
  tests/**/*.rs,\
  frontend/**/*.test.ts,\
  frontend/**/*.spec.ts

# --- Coverage (generated by the `just sonar-scan` prerequisites) ---
# Rust: `just test-backend-coverage` (cargo-llvm-cov)
sonar.rust.lcov.reportPaths=lcov.info
# Frontend: `just test-frontend-coverage`
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
